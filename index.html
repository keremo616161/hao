
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZT3 Pro Firmware Analyzer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 24px auto;
      padding: 16px;
      background: #101318;
      color: #f3f4f6;
    }
    section {
      padding: 18px;
      margin: 16px 0;
      border: 1px solid #414854;
      border-radius: 14px;
    }
    input, button { margin-top: 12px; max-width: 100%; }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
    }
    .status {
      color: #c3ccda;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .warning { color: #ffd18a; }
  </style>
</head>
<body>
  <h1>ZT3 Pro Firmware Analyzer</h1>
  <p>Lokale Dateianalyse · VCU und MCU</p>

  <section>
    <h2>VCU-Datei</h2>
    <input id="vcu" type="file">
    <p id="vcuStatus" class="status">Keine Datei ausgewählt.</p>
  </section>

  <section>
    <h2>MCU-Datei</h2>
    <input id="mcu" type="file">
    <p id="mcuStatus" class="status">Keine Datei ausgewählt.</p>
  </section>

  <section>
    <h2>Analyse</h2>
    <p class="status">
      Dateien werden lokal analysiert. Es wird nichts hochgeladen.
      Die Analyse bestätigt keine Firmware-Kompatibilität.
    </p>
    <button id="analyze">Beide Dateien analysieren</button>
    <p id="result" class="status" aria-live="polite">
      Warte auf Dateien.
    </p>
  </section>

<script>
  const MAX_SIZE = 32 * 1024 * 1024;

  async function analyzeFile(inputId, statusId) {
    const file = document.getElementById(inputId).files[0];
    const status = document.getElementById(statusId);

    if (!file) {
      status.textContent = "Keine Datei ausgewählt.";
      return null;
    }

    if (file.size === 0) {
      throw new Error(file.name + ": Datei ist leer.");
    }

    if (file.size > MAX_SIZE) {
      throw new Error(file.name + ": Maximal 32 MiB erlaubt.");
    }

    if (!crypto.subtle) {
      throw new Error("SHA-256 benötigt eine sichere HTTPS-Seite.");
    }

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    const digest = await crypto.subtle.digest("SHA-256", buffer);

    const hash = Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    const header = Array.from(bytes.slice(0, 16))
      .map(b => b.toString(16).padStart(2, "0"))
      .join(" ");

    const dot = file.name.lastIndexOf(".");
    const extension = dot >= 0
      ? file.name.slice(dot).toLowerCase()
      : "(keine)";

    const report = [
      "Datei: " + file.name,
      "Größe: " + file.size + " Bytes",
      "Endung: " + extension,
      "Erste Bytes: " + (header || "(leer)"),
      "SHA-256: " + hash,
      "Format: Noch nicht identifiziert",
      "Kompatibilität: Nicht geprüft"
    ].join("\n");

    status.textContent = report;

    return { name: file.name, size: file.size, hash };
  }

  document.getElementById("analyze").addEventListener("click", async () => {
    const button = document.getElementById("analyze");
    const result = document.getElementById("result");

    button.disabled = true;
    result.textContent = "Analysiere Dateien …";

    try {
      const vcu = await analyzeFile("vcu", "vcuStatus");
      const mcu = await analyzeFile("mcu", "mcuStatus");

      if (!vcu || !mcu) {
        result.textContent = "Bitte wähle beide Dateien aus.";
        return;
      }

      result.textContent =
        "Analyse abgeschlossen. Die Dateiberichte stehen oben. " +
        "Ein gültiger Build oder eine Kompatibilität wurde nicht bestätigt.";
    } catch (error) {
      result.textContent = "Fehler: " + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
